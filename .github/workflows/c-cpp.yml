name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build-linux64:
    # premake 5.0.0-beta7 требует glibc 2.38, поэтому проект генерируется на свежем раннере,
    # а компилируется в Ubuntu 20.04 (glibc 2.31) — чтобы модуль грузился и на старых серверах.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        repository: danielga/garrysmod_common
        ref: x86-64-support-sourcesdk
        path: garrysmod_common
    - name: Install Premake
      run: |
        wget -q https://github.com/premake/premake-core/releases/download/v5.0.0-beta7/premake-5.0.0-beta7-linux.tar.gz -O premake.tar.gz
        tar -xf premake.tar.gz
        sudo cp premake5 /usr/bin
    - name: Generate project
      run: premake5 --gmcommon=garrysmod_common gmake
    - name: Build (Ubuntu 20.04 container)
      run: |
        docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/projects/linux/gmake" ubuntu:20.04 bash -c '
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq g++ make > /dev/null
          make config=releasewithsymbols_x86_64 -j$(nproc)
        '
    - name: Check glibc requirements
      run: |
        objdump -T projects/linux/gmake/x86_64/ReleaseWithSymbols/gmsv_voicefx_linux64.dll | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -3
    - uses: actions/upload-artifact@v4
      with:
        name: gmsv_voicefx_linux64.dll
        path: projects/linux/gmake/x86_64/ReleaseWithSymbols/gmsv_voicefx_linux64.dll

  build-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        repository: danielga/garrysmod_common
        ref: x86-64-support-sourcesdk
        path: garrysmod_common
    - uses: microsoft/setup-msbuild@v2
    - name: Install Premake
      run: |
        curl -L https://github.com/premake/premake-core/releases/download/v5.0.0-beta7/premake-5.0.0-beta7-windows.zip -o premake.zip
        tar -xf premake.zip
    - name: Generate project
      run: ./premake5.exe --gmcommon=garrysmod_common vs2022
    - name: Build
      run: |
        cd projects/windows/vs2022
        msbuild /m /p:Configuration=ReleaseWithSymbols /p:Platform=Win32 voicefx.sln
        msbuild /m /p:Configuration=ReleaseWithSymbols /p:Platform=x64 voicefx.sln
    - uses: actions/upload-artifact@v4
      with:
        name: gmsv_voicefx_windows
        path: |
          projects/windows/vs2022/x86/ReleaseWithSymbols/gmsv_voicefx_win32.dll
          projects/windows/vs2022/x86_64/ReleaseWithSymbols/gmsv_voicefx_win64.dll
